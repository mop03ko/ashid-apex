name: Check aac.mn mail delivery

on:
  workflow_dispatch:
  push:
    branches: [claude/aac-mn-she5d5]
    paths: [scripts/mail-diagnose.mjs, .github/workflows/mail-check.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: aac.mn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Public DNS for aac.mn
        run: |
          for r in 1.1.1.1 8.8.8.8; do
            echo "== resolver $r"
            echo "NS:";  dig +short NS aac.mn @$r
            echo "MX:";  dig +short MX aac.mn @$r
            echo "A:";   dig +short A aac.mn @$r
            echo "aac.mail.mn A:"; dig +short A aac.mail.mn @$r
          done
          echo "SPF:"; dig +short TXT aac.mn @1.1.1.1 | grep -i spf || echo none
          for mx in $(dig +short MX aac.mn @1.1.1.1 | awk '{print $2}'); do
            echo "MX host $mx resolves to: $(dig +short A "$mx" @1.1.1.1 | tr '\n' ' ')"
          done
      - name: Diagnose info@aac.mn delivery
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
        run: node scripts/mail-diagnose.mjs --set-remote
