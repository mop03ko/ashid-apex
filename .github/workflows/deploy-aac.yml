name: Deploy to aac.mn

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aac
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: aac.mn
      url: https://aac.mn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and verify aac.mn package
        run: |
          npm test
          npm run cpanel -- https://aac.mn

      # Uploads over HTTPS (port 2083) with a cPanel API token or password. See CPANEL-GIT.md.
      - name: Upload to cPanel
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
          CPANEL_DOCROOT: ${{ secrets.CPANEL_DOCROOT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: node scripts/deploy-uapi.mjs

      - name: Check live site
        run: |
          if curl -fsSL --max-time 30 https://aac.mn/mn/index.html | grep -q 'href="https://aac.mn/mn/index.html"'; then
            echo "https://aac.mn serves the new build."
          else
            echo "::warning::Upload finished, but https://aac.mn did not return the new build. Check the Document Root and SSL."
          fi
